[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "assignment2-quanta"
version = "1.0.0"
description = "Educational E91, AES-GCM, and superdense coding demonstration"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.3",
  "cryptography==50.0.2",
  "gunicorn==23.0.0",
  "qiskit==2.6.1",
  "qiskit-aer==0.18.2",
  "requests==2.34.2",
]

[project.optional-dependencies]
test = [
  "PyYAML==6.0.3",
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
